name: AI Stock OS daily close
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update.py'
      - 'scripts/backfill.py'
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: ai-stock-os-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backfill selected TWSE stocks (first run only)
        run: |
          if [ ! -f data/backfill-status.json ]; then
            python scripts/backfill.py
          else
            echo 'Historical backfill already attempted; preserving existing data'
          fi
      - name: Refresh official snapshots
        run: python scripts/update.py
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/backfill-status.json
          git diff --cached --quiet || (git commit -m "data: update daily close" && git push)
