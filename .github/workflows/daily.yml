name: AI Stock OS daily close
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update.py'
      - 'scripts/backfill.py'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: ai-stock-os-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official daily snapshots
        run: python scripts/update.py
      - name: Commit daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "data: update official daily quotes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Backfill selected historical prices
        continue-on-error: true
        run: |
          python scripts/backfill.py
      - name: Recalculate rankings from available history
        if: always()
        continue-on-error: true
        run: python scripts/update.py
      - name: Commit historical data and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh history and research rankings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
