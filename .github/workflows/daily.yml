name: AI Stock OS daily close
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update.py'
      - 'scripts/backfill.py'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'
permissions:
  contents: write
concurrency:
  group: ai-stock-os-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backfill historical prices before ranking
        run: |
          if [ ! -f data/backfill-status.json ]; then
            python scripts/backfill.py
          else
            echo "Historical backfill report already exists"
          fi
      - name: Generate daily snapshot and ranked research
        run: python scripts/update.py
      - name: Check ranked data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/latest.json').read_text())
          ranks=data['rankings']
          print('Session:',data['latest_session'])
          print('History coverage:',data.get('coverage'))
          print('Rankings:',{k:len(v) for k,v in ranks.items()})
          if not ranks['short'] or not ranks['swing']:
              print('WARNING: historical ranking is still incomplete; review backfill-status.json')
          PY
      - name: Commit official market data and rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "data: publish historical rankings and daily market"
            # Data files are generated artifacts: regenerate against latest main on contention.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              echo "Concurrent data update detected; regenerating from current main (attempt $attempt)"
              git fetch origin main
              git reset --hard origin/main
              python scripts/backfill.py
              python scripts/update.py
              git add -A data/
              if git diff --cached --quiet; then exit 0; fi
              git commit -m "data: publish refreshed official market data (retry $attempt)"
            done
            echo "Failed to publish after retries" >&2
            exit 1
          fi
